openapi: 3.1.0
info:
  title: API du noyau HydroSEA
  version: 1.0.0
  description: Contrats REST des Services métier du noyau ; les règles restent définies par les RM.
servers:
  - url: https://api.example.hydrosea.fr
    description: URL illustrative, à configurer
tags:
  - name: Tiers
    description: Identités physiques et morales
  - name: Contrats
    description: Contrats d’abonnement et participations
  - name: Points
    description: Points de desserte et de consommation
  - name: Comptage
    description: Compteurs, affectations et relèves
  - name: Facturation
    description: Calcul et cycle des factures
  - name: Paiements
    description: Paiements, imputations et remboursements
  - name: Audit
    description: Lecture minimisée des événements métier
paths:
  /v1/tiers:
    get:
      operationId: rechercher_tiers
      x-hydrosea-disponibilite:
        statut: disponible
        implementation: hydrosea-app
        version_minimale: mission-006
      summary: Rechercher des Tiers
      description: Recherche multicritère paginée et minimisée. Cette opération ne qualifie pas les doublons ; BS-TIE-007 reste intégré à la création et aux décisions métier.
      tags:
        - Tiers
      security:
        - oauth2:
            - tiers:lecture
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: taille_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: tri
          in: query
          schema:
            type: string
            enum:
              - reference
              - date_creation
              - statut
            default: reference
        - name: direction
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
        - name: recherche
          in: query
          schema:
            type: string
        - name: reference
          in: query
          schema:
            type: string
        - name: categorie
          in: query
          schema:
            type: string
            enum:
              - PERSONNE_PHYSIQUE
              - PERSONNE_MORALE
        - name: statut
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Page de Tiers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageTiers'
        '400':
          $ref: '#/components/responses/RequeteInvalide'
        '401':
          $ref: '#/components/responses/AuthentificationRequise'
        '403':
          $ref: '#/components/responses/DroitInsuffisant'
        '409':
          $ref: '#/components/responses/ConflitMetier'
        '500':
          $ref: '#/components/responses/ErreurInterne'
      x-hydrosea-bs:
        - BS-TIE-003
      x-hydrosea-rm:
        - RM-TIE-010
      x-hydrosea-evt:
        - AUCUN_EVENEMENT_PRODUIT
      x-hydrosea-tables:
        - ref.tiers
        - ref.tiers_personne_physique
        - ref.tiers_personne_morale
    post:
      operationId: creer_tiers
      x-hydrosea-disponibilite:
        statut: disponible
        implementation: hydrosea-app
        version_minimale: mission-006
      summary: Créer un Tiers
      description: Crée atomiquement un Tiers personne physique ou morale et contrôle les doublons probables.
      tags:
        - Tiers
      security:
        - oauth2:
            - tiers:ecriture
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreerTiers'
            examples:
              personne_physique:
                $ref: '#/components/examples/personne_physique'
              personne_morale:
                $ref: '#/components/examples/personne_morale'
      responses:
        '201':
          description: Tiers créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tiers'
        '400':
          $ref: '#/components/responses/RequeteInvalide'
        '401':
          $ref: '#/components/responses/AuthentificationRequise'
        '403':
          $ref: '#/components/responses/DroitInsuffisant'
        '409':
          $ref: '#/components/responses/ConflitMetier'
        '500':
          $ref: '#/components/responses/ErreurInterne'
      x-hydrosea-bs:
        - BS-TIE-001
      x-hydrosea-rm:
        - RM-TIE-001
        - RM-TIE-002
        - RM-TIE-003
        - RM-TIE-007
        - RM-TIE-010
      x-hydrosea-evt:
        - EVT-TIE-001
      x-hydrosea-tables:
        - ref.tiers
        - ref.tiers_personne_physique
        - ref.tiers_personne_morale
  /v1/tiers/{identifiant_tiers}:
    parameters:
      - $ref: '#/components/parameters/IdentifiantTiers'
    get:
      operationId: consulter_tiers
      x-hydrosea-disponibilite:
        statut: disponible
        implementation: hydrosea-app
        version_minimale: mission-006
      summary: Consulter un Tiers
      description: Retourne la représentation autorisée du Tiers sans données internes inutiles.
      tags:
        - Tiers
      security:
        - oauth2:
            - tiers:lecture
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '200':
          description: Tiers trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tiers'
        '400':
          $ref: '#/components/responses/RequeteInvalide'
        '401':
          $ref: '#/components/responses/AuthentificationRequise'
        '403':
          $ref: '#/components/responses/DroitInsuffisant'
        '404':
          $ref: '#/components/responses/RessourceAbsente'
        '409':
          $ref: '#/components/responses/ConflitMetier'
        '500':
          $ref: '#/components/responses/ErreurInterne'
      x-hydrosea-bs:
        - BS-TIE-002
      x-hydrosea-rm:
        - RM-TIE-010
      x-hydrosea-evt:
        - AUCUN_EVENEMENT_PRODUIT
      x-hydrosea-tables:
        - ref.tiers
        - ref.tiers_personne_physique
        - ref.tiers_personne_morale
        - ref.coordonnees
    patch:
      operationId: modifier_tiers
      x-hydrosea-disponibilite:
        statut: disponible
        implementation: hydrosea-app
        version_minimale: mission-006
      summary: Modifier un Tiers
      description: Modifie une spécialisation complète selon la version attendue. Le contrat interdit catégorie, référence, statut et données techniques ; la compatibilité avec la catégorie existante est contrôlée par RM-TIE-003 et ne peut être exprimée par OpenAPI seul.
      tags:
        - Tiers
      security:
        - oauth2:
            - tiers:ecriture
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModifierTiers'
      responses:
        '200':
          description: Tiers modifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tiers'
        '400':
          $ref: '#/components/responses/RequeteInvalide'
        '401':
          $ref: '#/components/responses/AuthentificationRequise'
        '403':
          $ref: '#/components/responses/DroitInsuffisant'
        '404':
          $ref: '#/components/responses/RessourceAbsente'
        '409':
          $ref: '#/components/responses/ConflitMetier'
        '412':
          $ref: '#/components/responses/PreconditionVersion'
        '500':
          $ref: '#/components/responses/ErreurInterne'
      x-hydrosea-bs:
        - BS-TIE-004
      x-hydrosea-rm:
        - RM-TIE-001
        - RM-TIE-003
        - RM-TIE-004
        - RM-TIE-007
        - RM-TIE-008
        - RM-TIE-009
        - RM-TIE-010
      x-hydrosea-evt:
        - EVT-TIE-002
      x-hydrosea-tables:
        - ref.tiers
        - ref.tiers_personne_physique
        - ref.tiers_personne_morale
  /v1/tiers/{identifiant_tiers}/fusionner:
    parameters:
      - $ref: '#/components/parameters/IdentifiantTiers'
    post:
      operationId: fusionner_tiers
      x-hydrosea-disponibilite:
        statut: prospectif
        implementation: non_disponible
        depot_cible: hydrosea-app
        condition_activation: arbitrages_metier_valides
      summary: Fusionner deux Tiers
      description: Contrat prospectif non implémenté. Fusionne sous contrôle humain et conserve le Tiers absorbé ; sélection du survivant et transferts restent arbitrés dans BS-TIE-008.
      tags:
        - Tiers
      security:
        - oauth2:
            - tiers:ecriture
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - identifiant_tiers_conserve
                - motif
              properties:
                identifiant_tiers_conserve:
                  type: string
                  format: uuid
                motif:
                  type: string
      responses:
        '200':
          description: Tiers conservé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tiers'
        '400':
          $ref: '#/components/responses/RequeteInvalide'
        '401':
          $ref: '#/components/responses/AuthentificationRequise'
        '403':
          $ref: '#/components/responses/DroitInsuffisant'
        '404':
          $ref: '#/components/responses/RessourceAbsente'
        '409':
          $ref: '#/components/responses/ConflitMetier'
        '412':
          $ref: '#/components/responses/PreconditionVersion'
        '500':
          $ref: '#/components/responses/ErreurInterne'
      x-hydrosea-bs:
        - BS-TIE-008
      x-hydrosea-rm:
        - RM-TIE-001
        - RM-TIE-009
        - RM-TIE-010
        - RM-TIE-012
        - RM-TIE-013
      x-hydrosea-evt:
        - EVT-TIE-003
      x-hydrosea-tables:
        - ref.tiers
        - abo.participation_contrat
        - fac.facture
        - pai.paiement
        - ref.coordonnees
  /v1/tiers/{identifiant_tiers}/archiver:
    parameters:
      - $ref: '#/components/parameters/IdentifiantTiers'
    post:
      operationId: archiver_tiers
      x-hydrosea-disponibilite:
        statut: disponible
        implementation: hydrosea-app
        version_minimale: mission-006
      summary: Archiver un Tiers
      description: Archive logiquement le Tiers lorsque les dépendances métier l’autorisent ; la politique définitive sur contrats et dettes reste explicitement arbitrée dans BS-TIE-005.
      tags:
        - Tiers
      security:
        - oauth2:
            - tiers:ecriture
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - motif
              properties:
                motif:
                  type: string
      responses:
        '200':
          description: Tiers archivé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tiers'
        '400':
          $ref: '#/components/responses/RequeteInvalide'
        '401':
          $ref: '#/components/responses/AuthentificationRequise'
        '403':
          $ref: '#/components/responses/DroitInsuffisant'
        '404':
          $ref: '#/components/responses/RessourceAbsente'
        '409':
          $ref: '#/components/responses/ConflitMetier'
        '412':
          $ref: '#/components/responses/PreconditionVersion'
        '500':
          $ref: '#/components/responses/ErreurInterne'
      x-hydrosea-bs:
        - BS-TIE-005
      x-hydrosea-rm:
        - RM-TIE-005
        - RM-TIE-006
        - RM-TIE-009
        - RM-TIE-010
      x-hydrosea-evt:
        - EVT-TIE-004
      x-hydrosea-tables:
        - ref.tiers
  /v1/tiers/{identifiant_tiers}/reactiver:
    parameters:
      - $ref: '#/components/parameters/IdentifiantTiers'
    post:
      operationId: reactiver_tiers
      x-hydrosea-disponibilite:
        statut: prospectif
        implementation: non_disponible
        depot_cible: hydrosea-app
        condition_activation: arbitrages_metier_valides
      summary: Réactiver un Tiers
      description: Contrat prospectif non implémenté. Réactive un Tiers archivé en conservant identifiant et référence après contrôle des doublons et dépendances.
      tags:
        - Tiers
      security:
        - oauth2:
            - tiers:ecriture
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '200':
          description: Tiers réactivé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tiers'
        '400':
          $ref: '#/components/responses/RequeteInvalide'
        '401':
          $ref: '#/components/responses/AuthentificationRequise'
        '403':
          $ref: '#/components/responses/DroitInsuffisant'
        '404':
          $ref: '#/components/responses/RessourceAbsente'
        '409':
          $ref: '#/components/responses/ConflitMetier'
        '412':
          $ref: '#/components/responses/PreconditionVersion'
        '500':
          $ref: '#/components/responses/ErreurInterne'
      x-hydrosea-bs:
        - BS-TIE-006
      x-hydrosea-rm:
        - RM-TIE-001
        - RM-TIE-007
        - RM-TIE-009
        - RM-TIE-010
        - RM-TIE-011
      x-hydrosea-evt:
        - EVT-TIE-005
      x-hydrosea-tables:
        - ref.tiers
  /v1/contrats-abonnement:
    get:
      operationId: rechercher_contrats_abonnement
      x-hydrosea-disponibilite:
        statut: prospectif
        implementation: non_disponible
        depot_cible: hydrosea-app
        condition_activation: arbitrages_metier_valides
      summary: Rechercher des contrats d’abonnement
      description: Recherche paginée par référence, statut, Tiers ou Point de consommation.
      tags:
        - Contrats
      security:
        - oauth2:
            - contrats:lecture
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: taille_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: tri
          in: query
          schema:
            type: string
            enum:
              - date_creation
              - reference
              - statut
              - date_effet
            default: date_creation
        - name: direction
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
        - name: statut
          in: query
          schema:
            type: string
        - name: reference
          in: query
          schema:
            type: string
        - name: identifiant_tiers
          in: query
          schema:
            type: string
            format: uuid
        - name: identifiant_point_consommation
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Page de contrats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageContratsAbonnement'
        '400':
          $ref: '#/components/responses/RequeteInvalide'
        '401':
          $ref: '#/components/responses/AuthentificationRequise'
        '403':
          $ref: '#/components/responses/DroitInsuffisant'
        '409':
          $ref: '#/components/responses/ConflitMetier'
        '500':
          $ref: '#/components/responses/ErreurInterne'
      x-hydrosea-bs:
        - BS-CTR-007
      x-hydrosea-rm:
        - RM-CTR-014
        - RM-CTR-015
      x-hydrosea-evt:
        - AUCUN_EVENEMENT_PRODUIT
      x-hydrosea-tables:
        - abo.contrat_abonnement
        - abo.participation_contrat
        - abo.liaison_contrat_consommation
    post:
      operationId: creer_contrat_abonnement
      x-hydrosea-disponibilite:
        statut: prospectif
        implementation: non_disponible
        depot_cible: hydrosea-app
        condition_activation: arbitrages_metier_valides
      summary: Créer un contrat d’abonnement
      description: Crée un brouillon relié à un Point de consommation et à ses participants initiaux.
      tags:
        - Contrats
      security:
        - oauth2:
            - contrats:ecriture
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreerContratAbonnement'
            examples:
              ouverture:
                $ref: '#/components/examples/ouverture'
      responses:
        '201':
          description: Brouillon créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContratAbonnement'
        '400':
          $ref: '#/components/responses/RequeteInvalide'
        '401':
          $ref: '#/components/responses/AuthentificationRequise'
        '403':
          $ref: '#/components/responses/DroitInsuffisant'
        '409':
          $ref: '#/components/responses/ConflitMetier'
        '500':
          $ref: '#/components/responses/ErreurInterne'
      x-hydrosea-bs:
        - BS-CTR-001
      x-hydrosea-rm:
        - RM-CTR-001
        - RM-CTR-003
        - RM-CTR-004
        - RM-CTR-010
        - RM-CTR-011
        - RM-CTR-014
        - RM-CTR-015
      x-hydrosea-evt:
        - EVT-CTR-001
      x-hydrosea-tables:
        - abo.contrat_abonnement
        - abo.liaison_contrat_consommation
        - abo.participation_contrat
  /v1/contrats-abonnement/{identifiant_contrat}:
    parameters:
      - $ref: '#/components/parameters/IdentifiantContrat'
    get:
      operationId: consulter_contrat_abonnement
      x-hydrosea-disponibilite:
        statut: prospectif
        implementation: non_disponible
        depot_cible: hydrosea-app
        condition_activation: arbitrages_metier_valides
      summary: Consulter un contrat d’abonnement
      description: Retourne le contrat, son Point de consommation et ses participants autorisés.
      tags:
        - Contrats
      security:
        - oauth2:
            - contrats:lecture
      responses:
        '200':
          description: Contrat trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContratAbonnement'
        '400':
          $ref: '#/components/responses/RequeteInvalide'
        '401':
          $ref: '#/components/responses/AuthentificationRequise'
        '403':
          $ref: '#/components/responses/DroitInsuffisant'
        '404':
          $ref: '#/components/responses/RessourceAbsente'
        '409':
          $ref: '#/components/responses/ConflitMetier'
        '500':
          $ref: '#/components/responses/ErreurInterne'
      x-hydrosea-bs:
        - BS-CTR-006
      x-hydrosea-rm:
        - RM-CTR-011
        - RM-CTR-014
        - RM-CTR-015
      x-hydrosea-evt:
        - AUCUN_EVENEMENT_PRODUIT
      x-hydrosea-tables:
        - abo.contrat_abonnement
        - abo.participation_contrat
        - abo.liaison_contrat_consommation
    patch:
      operationId: modifier_contrat_abonnement
      x-hydrosea-disponibilite:
        statut: prospectif
        implementation: non_disponible
        depot_cible: hydrosea-app
        condition_activation: arbitrages_metier_valides
      summary: Modifier un contrat d’abonnement
      description: Modifie les données autorisées avant ou pendant le cycle du contrat, sans commander une transition.
      tags:
        - Contrats
      security:
        - oauth2:
            - contrats:ecriture
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModifierContratAbonnement'
      responses:
        '200':
          description: Contrat modifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContratAbonnement'
        '400':
          $ref: '#/components/responses/RequeteInvalide'
        '401':
          $ref: '#/components/responses/AuthentificationRequise'
        '403':
          $ref: '#/components/responses/DroitInsuffisant'
        '404':
          $ref: '#/components/responses/RessourceAbsente'
        '409':
          $ref: '#/components/responses/ConflitMetier'
        '412':
          $ref: '#/components/responses/PreconditionVersion'
        '500':
          $ref: '#/components/responses/ErreurInterne'
      x-hydrosea-bs:
        - BS-CTR-002
      x-hydrosea-rm:
        - RM-CTR-010
        - RM-CTR-013
        - RM-CTR-014
      x-hydrosea-evt:
        - EVT-CTR-010
      x-hydrosea-tables:
        - abo.contrat_abonnement
  /v1/contrats-abonnement/{identifiant_contrat}/valider:
    parameters:
      - $ref: '#/components/parameters/IdentifiantContrat'
    post:
      operationId: valider_contrat_abonnement
      x-hydrosea-disponibilite:
        statut: prospectif
        implementation: non_disponible
        depot_cible: hydrosea-app
        condition_activation: arbitrages_metier_valides
      summary: Valider un contrat d’abonnement
      description: Vérifie les préconditions métier avant activation ; les contrôles restent définis par RM-CTR.
      tags:
        - Contrats
      security:
        - oauth2:
            - contrats:ecriture
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValiderContrat'
      responses:
        '200':
          description: Contrat validé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContratAbonnement'
        '400':
          $ref: '#/components/responses/RequeteInvalide'
        '401':
          $ref: '#/components/responses/AuthentificationRequise'
        '403':
          $ref: '#/components/responses/DroitInsuffisant'
        '404':
          $ref: '#/components/responses/RessourceAbsente'
        '409':
          $ref: '#/components/responses/ConflitMetier'
        '412':
          $ref: '#/components/responses/PreconditionVersion'
        '500':
          $ref: '#/components/responses/ErreurInterne'
      x-hydrosea-bs:
        - BS-CTR-008
      x-hydrosea-rm:
        - RM-CTR-001
        - RM-CTR-003
        - RM-CTR-004
        - RM-CTR-005
        - RM-CTR-010
        - RM-CTR-011
        - RM-CTR-014
        - RM-CTR-015
      x-hydrosea-evt:
        - EVT-CTR-002
      x-hydrosea-tables:
