          description: Page d’événements minimisés
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageEvenementsMetier'
        '400':
          $ref: '#/components/responses/RequeteInvalide'
        '401':
          $ref: '#/components/responses/AuthentificationRequise'
        '403':
          $ref: '#/components/responses/DroitInsuffisant'
        '500':
          $ref: '#/components/responses/ErreurInterne'
      x-hydrosea-bs:
        - A_ARBITRER_BS_AUDIT
      x-hydrosea-rm:
        - ADR-006
      x-hydrosea-evt:
        - EVT-*
      x-hydrosea-tables:
        - evt.evenement_metier
components:
  schemas:
    Tiers:
      allOf:
        - $ref: '#/components/schemas/IdentiteVersionnee'
        - type: object
          required:
            - identifiant_tiers
            - reference
            - categorie
            - statut
          properties:
            identifiant_tiers:
              type: string
              format: uuid
              readOnly: true
            reference:
              type: string
              maxLength: 40
              example: TIE-000042
              readOnly: true
            categorie:
              type: string
              enum:
                - PERSONNE_PHYSIQUE
                - PERSONNE_MORALE
              readOnly: true
            statut:
              type: string
              example: ACTIF
              readOnly: true
            personne_physique:
              $ref: '#/components/schemas/PersonnePhysique'
            personne_morale:
              $ref: '#/components/schemas/PersonneMorale'
            coordonnees:
              type: array
              items:
                $ref: '#/components/schemas/Coordonnee'
      description: Représentation minimisée de BO-001. Voir le dictionnaire de données et RM-TIE.
    PersonnePhysique:
      type: object
      required:
        - nom
        - prenoms
      properties:
        nom:
          type: string
          example: Martin
        nom_usage:
          type: string
        prenoms:
          type: string
          example: Camille
        date_naissance:
          type: string
          format: date
          writeOnly: true
    PersonneMorale:
      type: object
      required:
        - raison_sociale
      properties:
        raison_sociale:
          type: string
          example: Atelier de l'Anjou
        siret:
          type: string
          pattern: ^[0-9]{14}$
          example: '12345678901234'
        forme_juridique:
          type: string
          example: SAS
    Coordonnee:
      allOf:
        - $ref: '#/components/schemas/IdentiteVersionnee'
        - type: object
          required:
            - type_coordonnees
            - valeur
            - principale
          properties:
            identifiant_coordonnees:
              type: string
              format: uuid
              readOnly: true
            type_coordonnees:
              type: string
              example: COURRIEL
            valeur:
              type: string
              example: camille.martin@example.fr
            principale:
              type: boolean
            date_debut_validite:
              type: string
              format: date-time
            date_fin_validite:
              type: string
              format: date-time
    Adresse:
      allOf:
        - $ref: '#/components/schemas/IdentiteVersionnee'
        - type: object
          required:
            - reference
            - commune
          properties:
            identifiant_adresse:
              type: string
              format: uuid
              readOnly: true
            reference:
              type: string
              example: ADR-49007-001
            numero_voie:
              type: string
            nom_voie:
              type: string
              example: rue de la Loire
            complement:
              type: string
            code_postal:
              type: string
              pattern: ^[0-9]{5}$
              example: '49000'
            commune:
              type: string
              example: Angers
    ContratAbonnement:
      allOf:
        - $ref: '#/components/schemas/IdentiteVersionnee'
        - type: object
          required:
            - identifiant_contrat
            - reference
            - statut
          properties:
            identifiant_contrat:
              type: string
              format: uuid
              readOnly: true
            reference:
              type: string
              example: CTR-2026-000128
              readOnly: true
            statut:
              type: string
              enum:
                - BROUILLON
                - A_VALIDER
                - VALIDE
                - ACTIF
                - SUSPENDU
                - RESILIE
                - ANNULE
              readOnly: true
            nature_abonnement:
              type: string
            date_demande:
              type: string
              format: date-time
            date_effet:
              type: string
              format: date-time
            date_fin:
              type: string
              format: date-time
            date_resiliation:
              type: string
              format: date-time
            identifiant_point_consommation_courant:
              type: string
              format: uuid
              readOnly: true
              description: Projection de la liaison temporelle abo.liaison_contrat_consommation à l’instant courant.
            participants:
              type: array
              items:
                $ref: '#/components/schemas/ParticipationContrat'
            preferences_facturation:
              $ref: '#/components/schemas/PreferencesFacturationContrat'
            preferences_reglement:
              $ref: '#/components/schemas/PreferencesReglementContrat'
    ParticipationContrat:
      allOf:
        - $ref: '#/components/schemas/IdentiteVersionnee'
        - type: object
          required:
            - identifiant_tiers
            - role_contractuel
            - principal
            - date_debut_validite
          properties:
            identifiant_participation:
              type: string
              format: uuid
              readOnly: true
            identifiant_tiers:
              type: string
              format: uuid
            role_contractuel:
              type: string
              enum:
                - TITULAIRE_PRINCIPAL
                - SOLIDAIRE
            principal:
              type: boolean
            responsabilite_financiere:
              type: boolean
            date_debut_validite:
              type: string
              format: date-time
            date_fin_validite:
              type: string
              format: date-time
            motif_fin:
              type: string
            ordre_affichage:
              type: integer
              minimum: 1
    PointDesserte:
      allOf:
        - $ref: '#/components/schemas/IdentiteVersionnee'
        - type: object
          required:
            - identifiant_point_desserte
            - reference
            - statut
          properties:
            identifiant_point_desserte:
              type: string
              format: uuid
              readOnly: true
            reference:
              type: string
              example: PD-004201
            identifiant_sig:
              type: string
              example: SIG-PD-88421
            statut:
              type: string
              example: ACTIF
            version_sig:
              type: string
              readOnly: true
            date_synchronisation:
              type: string
              format: date-time
              readOnly: true
      description: Patrimoine en lecture ; le SIG reste maître des géométries.
    PointConsommation:
      allOf:
        - $ref: '#/components/schemas/IdentiteVersionnee'
        - type: object
          required:
            - identifiant_point_consommation
            - reference
            - statut
          properties:
            identifiant_point_consommation:
              type: string
              format: uuid
              readOnly: true
            reference:
              type: string
              example: PC-009842
              readOnly: true
            statut:
              type: string
              enum:
                - PREPARE
                - OUVERT
                - FERME
              readOnly: true
            usage:
              type: string
              example: DOMESTIQUE
            identifiant_adresse:
              type: string
              format: uuid
            adresse:
              $ref: '#/components/schemas/Adresse'
            identifiant_point_desserte_courant:
              type: string
              format: uuid
              readOnly: true
              description: Projection de des.liaison_desserte_consommation à l’instant courant.
    Compteur:
      allOf:
        - $ref: '#/components/schemas/IdentiteVersionnee'
        - type: object
          required:
            - identifiant_compteur
            - numero_serie
            - statut
          properties:
            identifiant_compteur:
              type: string
              format: uuid
              readOnly: true
            numero_serie:
              type: string
              example: CPT-24-778899
              readOnly: true
            statut:
              type: string
              example: DISPONIBLE
              readOnly: true
            fabricant:
              type: string
              example: Hydrométrie France
            modele:
              type: string
              example: H100
            calibre:
              type: string
              example: DN15
    AffectationCompteur:
      allOf:
        - $ref: '#/components/schemas/IdentiteVersionnee'
        - type: object
          required:
            - identifiant_compteur
            - identifiant_point_consommation
            - date_debut_validite
            - statut
          properties:
            identifiant_affectation:
              type: string
              format: uuid
              readOnly: true
            identifiant_compteur:
              type: string
              format: uuid
            identifiant_point_consommation:
              type: string
              format: uuid
            date_debut_validite:
              type: string
              format: date-time
            date_fin_validite:
              type: string
              format: date-time
            index_pose:
              type: number
              minimum: 0
              example: 125.3
            index_depose:
              type: number
              minimum: 0
            statut:
              type: string
              example: ACTIVE
    Releve:
      allOf:
        - $ref: '#/components/schemas/IdentiteVersionnee'
        - type: object
          required:
            - identifiant_compteur
            - valeur_index
            - date_mesure
            - origine
            - statut
          properties:
            identifiant_releve:
              type: string
              format: uuid
              readOnly: true
            identifiant_compteur:
              type: string
              format: uuid
            identifiant_affectation:
              type: string
              format: uuid
            valeur_index:
              type: number
              minimum: 0
              example: 486.125
            date_mesure:
              type: string
              format: date-time
            origine:
              type: string
              example: MANUELLE
            statut:
              type: string
              example: A_CONTROLER
            estimation:
              type: boolean
            identifiant_releve_origine:
              type: string
              format: uuid
    BilanImportReleves:
      type: object
      required:
        - identifiant_import
        - nombre_lignes
        - nombre_acceptees
        - nombre_rejetees
        - resultats
      properties:
        identifiant_import:
          type: string
          format: uuid
        nombre_lignes:
          type: integer
          minimum: 0
        nombre_acceptees:
          type: integer
          minimum: 0
        nombre_rejetees:
          type: integer
          minimum: 0
        resultats:
          type: array
          items:
            type: object
            required:
              - numero_ligne
              - statut
            properties:
              numero_ligne:
                type: integer
                minimum: 1
              statut:
                type: string
                enum:
                  - ACCEPTEE
                  - REJETEE
              erreur:
                $ref: '#/components/schemas/ErreurApi'
    Facture:
      allOf:
        - $ref: '#/components/schemas/IdentiteVersionnee'
        - type: object
          required:
            - identifiant_facture
            - numero
            - identifiant_contrat
            - type_piece
            - periode_debut
            - periode_fin
            - statut
            - montant_ttc
          properties:
            identifiant_facture:
              type: string
              format: uuid
              readOnly: true
            numero:
              type: string
              example: FAC-2026-000321
              readOnly: true
            identifiant_contrat:
              type: string
              format: uuid
            type_piece:
              type: string
              enum:
                - FACTURE
                - AVOIR
                - CORRECTION
            identifiant_facture_origine:
              type: string
              format: uuid
            periode_debut:
              type: string
              format: date
            periode_fin:
              type: string
              format: date
            statut:
              type: string
              example: BROUILLON
            montant_ht:
              type: number
              minimum: 0
              multipleOf: 0.01
            montant_taxe:
              type: number
              minimum: 0
              multipleOf: 0.01
            montant_ttc:
              type: number
              minimum: 0
              multipleOf: 0.01
              example: 42.6
            lignes:
              type: array
              items:
                $ref: '#/components/schemas/LigneFacture'
    LigneFacture:
      allOf:
        - $ref: '#/components/schemas/IdentiteVersionnee'
        - type: object
          required:
            - ordre
            - nature
            - libelle
            - quantite
            - prix_unitaire
            - montant_ttc
          properties:
            identifiant_ligne_facture:
              type: string
              format: uuid
              readOnly: true
            ordre:
              type: integer
              minimum: 1
            nature:
              type: string
              example: CONSOMMATION
            libelle:
              type: string
              example: Consommation d'eau potable
            quantite:
              type: number
              minimum: 0
            prix_unitaire:
              type: number
              minimum: 0
            montant_ttc:
              type: number
              minimum: 0
    Paiement:
      allOf:
        - $ref: '#/components/schemas/IdentiteVersionnee'
        - type: object
          required:
            - identifiant_paiement
            - reference
            - sens
            - montant
            - moyen
            - date_valeur
            - statut
            - origine
          properties:
            identifiant_paiement:
              type: string
              format: uuid
              readOnly: true
            reference:
              type: string
              example: PAI-2026-000987
              readOnly: true
            identifiant_tiers_payeur:
              type: string
              format: uuid
            sens:
              type: string
              enum:
                - ENCAISSEMENT
                - DECAISSEMENT
            montant:
              type: number
              exclusiveMinimum: 0
              example: 70
            montant_disponible:
              type: number
              minimum: 0
              readOnly: true
            moyen:
              type: string
              example: VIREMENT
            date_valeur:
              type: string
              format: date
            reference_externe:
              type: string
              example: VIR-884401
            statut:
              type: string
              example: RECU
            origine:
              type: string
              example: BANQUE
    ImputationPaiement:
      allOf:
        - $ref: '#/components/schemas/IdentiteVersionnee'
        - type: object
          required:
            - identifiant_paiement
            - identifiant_facture
            - montant
            - statut
          properties:
            identifiant_imputation:
              type: string
              format: uuid
              readOnly: true
            identifiant_paiement:
              type: string
              format: uuid
            identifiant_facture:
              type: string
              format: uuid
            montant:
              type: number
              exclusiveMinimum: 0
            date_imputation:
              type: string
              format: date-time
              readOnly: true
            identifiant_imputation_origine:
              type: string
              format: uuid
            statut:
              type: string
              enum:
                - VALIDEE
                - CONTREPASSEE
    EvenementMetier:
      type: object
      readOnly: true
      required:
        - identifiant_evenement
        - type_evenement
        - type_agregat
        - identifiant_agregat
        - date_metier
      properties:
        identifiant_evenement:
          type: string
          format: uuid
        type_evenement:
          type: string
          example: evt_ctr_contrat_active
        type_agregat:
          type: string
          example: contrat_abonnement
        identifiant_agregat:
          type: string
          format: uuid
        date_metier:
          type: string
          format: date-time
        identifiant_correlation:
          type: string
          format: uuid
      description: Vue contrôlée et minimisée ; aucune écriture ni charge interne complète.
    ErreurApi:
      type: object
      required:
        - code
        - titre
        - detail
        - statut_http
        - identifiant_correlation
        - date_erreur
      properties:
        code:
          type: string
          example: SYS-VERSION-OBSOLETE
        titre:
          type: string
          example: Version obsolète
        detail:
          type: string
        statut_http:
          type: integer
          minimum: 400
          maximum: 599
        identifiant_correlation:
          type: string
          format: uuid
        date_erreur:
          type: string
          format: date-time
        champ:
          type: string
        regle_metier:
          type: string
          example: RM-CTR-001
        service_metier:
          type: string
          example: BS-CTR-002
        erreurs_enfants:
          type: array
          items:
            $ref: '#/components/schemas/ErreurApi'
    CreerTiers:
      oneOf:
        - $ref: '#/components/schemas/CreerTiersPersonnePhysique'
        - $ref: '#/components/schemas/CreerTiersPersonneMorale'
      discriminator:
        propertyName: categorie
        mapping:
          PERSONNE_PHYSIQUE: '#/components/schemas/CreerTiersPersonnePhysique'
          PERSONNE_MORALE: '#/components/schemas/CreerTiersPersonneMorale'
    ModifierTiers:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - personne_physique
          properties:
            personne_physique:
              $ref: '#/components/schemas/PersonnePhysique'
        - type: object
          additionalProperties: false
          required:
            - personne_morale
          properties:
            personne_morale:
              $ref: '#/components/schemas/PersonneMorale'
      description: Une et une seule spécialisation complète est obligatoire. RM-TIE-003 contrôle sa compatibilité avec la catégorie existante.
    CreerContratAbonnement:
      type: object
      additionalProperties: false
      required:
        - date_demande
        - date_effet_souhaitee
        - nature_abonnement
        - identifiant_point_consommation
        - participants
      properties:
        date_demande:
          type: string
          format: date-time
        date_effet_souhaitee:
          type: string
          format: date-time
        date_fin_prevue:
          type: string
          format: date-time
        nature_abonnement:
          type: string
          minLength: 1
        identifiant_point_consommation:
          type: string
          format: uuid
        participants:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreerParticipationContrat'
        preferences_facturation:
          $ref: '#/components/schemas/PreferencesFacturationContrat'
        preferences_reglement:
          $ref: '#/components/schemas/PreferencesReglementContrat'
        references_documents:
          type: array
          items:
            type: string
    CreerParticipationContrat:
      description: Deux variantes exclusives. Les booléens redondants restent imposés pour expliciter les invariants jusqu’à arbitrage de leur suppression.
      oneOf:
        - title: Titulaire principal
          type: object
          additionalProperties: false
          required:
            - identifiant_tiers
            - role_contractuel
            - principal
            - responsabilite_financiere
            - ordre_affichage
            - date_debut_validite
            - motif_debut
          properties:
            identifiant_tiers:
              type: string
              format: uuid
            role_contractuel:
              const: TITULAIRE_PRINCIPAL
            principal:
              const: true
            responsabilite_financiere:
              const: true
            ordre_affichage:
              type: integer
              minimum: 1
            date_debut_validite:
              type: string
              format: date-time
            motif_debut:
              type: string
              minLength: 1
        - title: Tiers solidaire
          type: object
          additionalProperties: false
          required:
            - identifiant_tiers
            - role_contractuel
            - principal
            - responsabilite_financiere
            - ordre_affichage
            - date_debut_validite
            - motif_debut
          properties:
            identifiant_tiers:
              type: string
              format: uuid
            role_contractuel:
              const: SOLIDAIRE
            principal:
              const: false
            responsabilite_financiere:
              const: true
            ordre_affichage:
              type: integer
              minimum: 1
            date_debut_validite:
              type: string
              format: date-time
            motif_debut:
              type: string
              minLength: 1
    PreferencesFacturationContrat:
      type: object
      additionalProperties: false
      description: Nomenclatures initiales révisables avant implémentation après arbitrage métier.
      properties:
        canal:
          type: string
          enum:
            - PAPIER
            - ELECTRONIQUE
            - PORTAIL
        frequence:
          type: string
          enum:
            - SELON_CYCLE
            - MENSUELLE
            - TRIMESTRIELLE
            - SEMESTRIELLE
            - ANNUELLE
        regroupement_souhaite:
          type: boolean
    PreferencesReglementContrat:
      type: object
      additionalProperties: false
      description: Nomenclature initiale révisable avant implémentation après arbitrage métier.
      properties:
        moyen_souhaite:
          type: string
          enum:
            - AUCUN
            - PRELEVEMENT
            - VIREMENT
            - CHEQUE
            - CARTE
            - ESPECES
            - PAYFIP
        mensualisation_souhaitee:
          type: boolean
    ModifierContratAbonnement:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        date_fin_prevue:
          type: string
          format: date-time
        preferences_facturation:
          $ref: '#/components/schemas/PreferencesFacturationContrat'
        preferences_reglement:
          $ref: '#/components/schemas/PreferencesReglementContrat'
        motif_modification:
          type: string
          minLength: 1
    ModifierParticipationContrat:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        responsabilite_financiere:
          type: boolean
        ordre_affichage:
          type: integer
          minimum: 1
        motif_modification:
          type: string
          minLength: 1
    ValiderContrat:
      type: object
      additionalProperties: false
      required:
        - decision
      properties:
        decision:
          type: string
          enum:
            - VALIDER
            - RETOURNER_BROUILLON
        motif_retour:
          type: string
        references_documents:
          type: array
          items:
            type: string
    ActiverContrat:
      type: object
      additionalProperties: false
      properties:
        date_activation:
          type: string
          format: date-time
        activation_forcee:
          type: boolean
        motif_forcage:
          type: string
    SuspendreContrat:
      type: object
      additionalProperties: false
      required:
        - code_motif
        - date_debut
      properties:
        code_motif:
          type: string
          minLength: 1
        date_debut:
          type: string
          format: date-time
        date_fin_prevue:
          type: string
          format: date-time
        reference_justificatif:
          type: string
    ReactiverContrat:
      type: object
      additionalProperties: false
      required:
        - code_motif
        - date_reactivation
      properties:
        code_motif:
          type: string
          minLength: 1
        date_reactivation:
          type: string
          format: date-time
        reference_justificatif:
          type: string
    AnnulerContrat:
      type: object
      additionalProperties: false
      required:
        - code_motif
        - date_annulation
      properties:
        code_motif:
          type: string
          minLength: 1
        date_annulation:
          type: string
          format: date-time
        identifiant_decisionnaire:
          type: string
          format: uuid
        reference_justificatif:
          type: string
    ResilierContrat:
      type: object
      additionalProperties: false
      required:
        - date_demande
        - date_resiliation
        - code_motif
      properties:
        date_demande:
          type: string
          format: date-time
        date_resiliation:
          type: string
          format: date-time
        code_motif:
          type: string
          minLength: 1
        identifiant_releve_finale:
          type: string
          format: uuid
        justification_absence_releve:
          type: string
        references_documents:
          type: array
          items:
            type: string
    MuterContrat:
      type: object
      additionalProperties: false
      required:
        - identifiant_tiers_entrant
        - date_mutation
        - nature_abonnement_entrant
      properties:
        identifiant_tiers_entrant:
          type: string
          format: uuid
        date_mutation:
          type: string
          format: date-time
        nature_abonnement_entrant:
          type: string
          minLength: 1
        identifiant_releve_mutation:
