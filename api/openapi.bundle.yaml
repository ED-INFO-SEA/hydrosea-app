      x-hydrosea-rm:
        - RM-PAI
      x-hydrosea-evt:
        - EVT-PAI-003
      x-hydrosea-tables:
        - pai.imputation_paiement
  /v1/paiements/{identifiant_paiement}/rembourser:
    parameters:
      - $ref: '#/components/parameters/IdentifiantPaiement'
    post:
      operationId: rembourser_paiement
      summary: Rembourser un paiement
      description: Commande un décaissement lié ; les conditions définitives relèvent de BS-PAI-002.
      tags:
        - Paiements
      security:
        - oauth2:
            - paiements:ecriture
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - montant
                - motif
              properties:
                montant:
                  type: number
                  exclusiveMinimum: 0
                motif:
                  type: string
      responses:
        '201':
          description: Remboursement enregistré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Paiement'
        '400':
          $ref: '#/components/responses/RequeteInvalide'
        '401':
          $ref: '#/components/responses/AuthentificationRequise'
        '403':
          $ref: '#/components/responses/DroitInsuffisant'
        '404':
          $ref: '#/components/responses/RessourceAbsente'
        '409':
          $ref: '#/components/responses/ConflitMetier'
        '412':
          $ref: '#/components/responses/PreconditionVersion'
        '500':
          $ref: '#/components/responses/ErreurInterne'
      x-hydrosea-bs:
        - BS-PAI-002
      x-hydrosea-rm:
        - RM-PAI
      x-hydrosea-evt:
        - EVT-PAI-004
      x-hydrosea-tables:
        - pai.paiement
  /v1/evenements-metier:
    get:
      operationId: rechercher_evenements_metier
      summary: Rechercher des événements métier
      description: Lecture contrôlée et minimisée ; aucune charge complète ni opération d’écriture n’est exposée.
      tags:
        - Audit
      security:
        - oauth2:
            - audit:lecture
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: taille_page
          in: query
          schema:
            type: integer
            maximum: 100
        - name: type_evenement
          in: query
          schema:
            type: string
        - name: identifiant_agregat
          in: query
          schema:
            type: string
            format: uuid
        - name: date_debut
          in: query
          schema:
            type: string
            format: date-time
        - name: date_fin
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Page d’événements minimisés
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageEvenementsMetier'
        '400':
          $ref: '#/components/responses/RequeteInvalide'
        '401':
          $ref: '#/components/responses/AuthentificationRequise'
        '403':
          $ref: '#/components/responses/DroitInsuffisant'
        '500':
          $ref: '#/components/responses/ErreurInterne'
      x-hydrosea-bs:
        - A_ARBITRER_BS_AUDIT
      x-hydrosea-rm:
        - ADR-006
      x-hydrosea-evt:
        - EVT-*
      x-hydrosea-tables:
        - evt.evenement_metier
components:
  schemas:
    Tiers:
      allOf:
        - $ref: '#/components/schemas/IdentiteVersionnee'
        - type: object
          required:
            - identifiant_tiers
            - reference
            - categorie
            - statut
          properties:
            identifiant_tiers:
              type: string
              format: uuid
              readOnly: true
            reference:
              type: string
              maxLength: 40
              example: TIE-000042
              readOnly: true
            categorie:
              type: string
              enum:
                - PERSONNE_PHYSIQUE
                - PERSONNE_MORALE
              readOnly: true
            statut:
              type: string
              example: ACTIF
              readOnly: true
            personne_physique:
              $ref: '#/components/schemas/PersonnePhysique'
            personne_morale:
              $ref: '#/components/schemas/PersonneMorale'
            coordonnees:
              type: array
              items:
                $ref: '#/components/schemas/Coordonnee'
      description: Représentation minimisée de BO-001. Voir le dictionnaire de données et RM-TIE.
    PersonnePhysique:
      type: object
      required:
        - nom
        - prenoms
      properties:
        nom:
          type: string
          example: Martin
        nom_usage:
          type: string
        prenoms:
          type: string
          example: Camille
        date_naissance:
          type: string
          format: date
          writeOnly: true
    PersonneMorale:
      type: object
      required:
        - raison_sociale
      properties:
        raison_sociale:
          type: string
          example: Atelier de l'Anjou
        siret:
          type: string
          pattern: ^[0-9]{14}$
          example: '12345678901234'
        forme_juridique:
          type: string
          example: SAS
    Coordonnee:
      allOf:
        - $ref: '#/components/schemas/IdentiteVersionnee'
        - type: object
          required:
            - type_coordonnees
            - valeur
            - principale
          properties:
            identifiant_coordonnees:
              type: string
              format: uuid
              readOnly: true
            type_coordonnees:
              type: string
              example: COURRIEL
            valeur:
              type: string
              example: camille.martin@example.fr
            principale:
              type: boolean
            date_debut_validite:
              type: string
              format: date-time
            date_fin_validite:
              type: string
              format: date-time
    Adresse:
      allOf:
        - $ref: '#/components/schemas/IdentiteVersionnee'
        - type: object
          required:
            - reference
            - commune
          properties:
            identifiant_adresse:
              type: string
              format: uuid
              readOnly: true
            reference:
              type: string
              example: ADR-49007-001
            numero_voie:
              type: string
            nom_voie:
              type: string
              example: rue de la Loire
            complement:
              type: string
            code_postal:
              type: string
              pattern: ^[0-9]{5}$
              example: '49000'
            commune:
              type: string
              example: Angers
    ContratAbonnement:
      allOf:
        - $ref: '#/components/schemas/IdentiteVersionnee'
        - type: object
          required:
            - identifiant_contrat
            - reference
            - statut
          properties:
            identifiant_contrat:
              type: string
              format: uuid
              readOnly: true
            reference:
              type: string
              example: CTR-2026-000128
              readOnly: true
            statut:
              type: string
              example: BROUILLON
              readOnly: true
            date_effet:
              type: string
              format: date-time
            date_fin:
              type: string
              format: date-time
            date_resiliation:
              type: string
              format: date-time
            identifiant_point_consommation_courant:
              type: string
              format: uuid
              readOnly: true
              description: Projection de la liaison temporelle abo.liaison_contrat_consommation à l’instant courant.
            participants:
              type: array
              items:
                $ref: '#/components/schemas/ParticipationContrat'
    ParticipationContrat:
      allOf:
        - $ref: '#/components/schemas/IdentiteVersionnee'
        - type: object
          required:
            - identifiant_tiers
            - role_contractuel
            - principal
            - date_debut_validite
          properties:
            identifiant_participation:
              type: string
              format: uuid
              readOnly: true
            identifiant_tiers:
              type: string
              format: uuid
            role_contractuel:
              type: string
              example: TITULAIRE
            principal:
              type: boolean
            responsabilite_financiere:
              type: boolean
            date_debut_validite:
              type: string
              format: date-time
            date_fin_validite:
              type: string
              format: date-time
            motif_fin:
              type: string
    PointDesserte:
      allOf:
        - $ref: '#/components/schemas/IdentiteVersionnee'
        - type: object
          required:
            - identifiant_point_desserte
            - reference
            - identifiant_sig
            - statut
          properties:
            identifiant_point_desserte:
              type: string
              format: uuid
              readOnly: true
            reference:
              type: string
              example: PD-004201
            identifiant_sig:
              type: string
              example: SIG-PD-88421
            statut:
              type: string
              example: ACTIF
            version_sig:
              type: string
              readOnly: true
            date_synchronisation:
              type: string
              format: date-time
              readOnly: true
      description: Patrimoine en lecture ; le SIG reste maître des géométries.
    PointConsommation:
      allOf:
        - $ref: '#/components/schemas/IdentiteVersionnee'
        - type: object
          required:
            - identifiant_point_consommation
            - reference
            - statut
          properties:
            identifiant_point_consommation:
              type: string
              format: uuid
              readOnly: true
            reference:
              type: string
              example: PC-009842
              readOnly: true
            statut:
              type: string
              enum:
                - PREPARE
                - OUVERT
                - FERME
              readOnly: true
            usage:
              type: string
              example: DOMESTIQUE
            identifiant_adresse:
              type: string
              format: uuid
            adresse:
              $ref: '#/components/schemas/Adresse'
            identifiant_point_desserte_courant:
              type: string
              format: uuid
              readOnly: true
              description: Projection de des.liaison_desserte_consommation à l’instant courant.
    Compteur:
      allOf:
        - $ref: '#/components/schemas/IdentiteVersionnee'
        - type: object
          required:
            - identifiant_compteur
            - numero_serie
            - statut
          properties:
            identifiant_compteur:
              type: string
              format: uuid
              readOnly: true
            numero_serie:
              type: string
              example: CPT-24-778899
              readOnly: true
            statut:
              type: string
              example: DISPONIBLE
              readOnly: true
            fabricant:
              type: string
              example: Hydrométrie France
            modele:
              type: string
              example: H100
            calibre:
              type: string
              example: DN15
    AffectationCompteur:
      allOf:
        - $ref: '#/components/schemas/IdentiteVersionnee'
        - type: object
          required:
            - identifiant_compteur
            - identifiant_point_consommation
            - date_debut_validite
            - statut
          properties:
            identifiant_affectation:
              type: string
              format: uuid
              readOnly: true
            identifiant_compteur:
              type: string
              format: uuid
            identifiant_point_consommation:
              type: string
              format: uuid
            date_debut_validite:
              type: string
              format: date-time
            date_fin_validite:
              type: string
              format: date-time
            index_pose:
              type: number
              minimum: 0
              example: 125.3
            index_depose:
              type: number
              minimum: 0
            statut:
              type: string
              example: ACTIVE
    Releve:
      allOf:
        - $ref: '#/components/schemas/IdentiteVersionnee'
        - type: object
          required:
            - identifiant_compteur
            - valeur_index
            - date_mesure
            - origine
            - statut
          properties:
            identifiant_releve:
              type: string
              format: uuid
