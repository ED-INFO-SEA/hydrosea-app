openapi: 3.1.0
info:
  title: API du noyau HydroSEA
  version: 1.0.0
  description: Contrats REST des Services métier du noyau ; les règles restent définies par les RM.
servers:
  - url: https://api.example.hydrosea.fr
    description: URL illustrative, à configurer
tags:
  - name: Tiers
    description: Identités physiques et morales
  - name: Contrats
    description: Contrats d’abonnement et participations
  - name: Points
    description: Points de desserte et de consommation
  - name: Comptage
    description: Compteurs, affectations et relèves
  - name: Facturation
    description: Calcul et cycle des factures
  - name: Paiements
    description: Paiements, imputations et remboursements
  - name: Audit
    description: Lecture minimisée des événements métier
paths:
  /v1/tiers:
    get:
      operationId: rechercher_tiers
      summary: Rechercher des Tiers
      description: Recherche multicritère et détection indicative de doublons ; la décision de fusion reste métier.
      tags:
        - Tiers
      security:
        - oauth2:
            - tiers:lecture
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: taille_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: recherche
          in: query
          schema:
            type: string
        - name: reference
          in: query
          schema:
            type: string
        - name: categorie
          in: query
          schema:
            type: string
            enum:
              - PERSONNE_PHYSIQUE
              - PERSONNE_MORALE
        - name: statut
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Page de Tiers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageTiers'
        '400':
          $ref: '#/components/responses/RequeteInvalide'
        '401':
          $ref: '#/components/responses/AuthentificationRequise'
        '403':
          $ref: '#/components/responses/DroitInsuffisant'
        '409':
          $ref: '#/components/responses/ConflitMetier'
        '500':
          $ref: '#/components/responses/ErreurInterne'
      x-hydrosea-bs:
        - A_ARBITRER_BS_TIERS
      x-hydrosea-rm:
        - RM-TIE
      x-hydrosea-evt:
        - EVT-TIE-001
      x-hydrosea-tables:
        - ref.tiers
        - ref.tiers_personne_physique
        - ref.tiers_personne_morale
    post:
      operationId: creer_tiers
      summary: Créer un Tiers
      description: Crée atomiquement un Tiers personne physique ou morale et contrôle les doublons probables.
      tags:
        - Tiers
      security:
        - oauth2:
            - tiers:ecriture
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreerTiers'
            examples:
              personne_physique:
                $ref: '#/components/examples/personne_physique'
              personne_morale:
                $ref: '#/components/examples/personne_morale'
      responses:
        '201':
          description: Tiers créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tiers'
        '400':
          $ref: '#/components/responses/RequeteInvalide'
        '401':
          $ref: '#/components/responses/AuthentificationRequise'
        '403':
          $ref: '#/components/responses/DroitInsuffisant'
        '409':
          $ref: '#/components/responses/ConflitMetier'
        '500':
          $ref: '#/components/responses/ErreurInterne'
      x-hydrosea-bs:
        - A_ARBITRER_BS_TIERS
      x-hydrosea-rm:
        - RM-TIE-001
        - RM-TIE-002
      x-hydrosea-evt:
        - EVT-TIE-001
      x-hydrosea-tables:
        - ref.tiers
        - ref.tiers_personne_physique
        - ref.tiers_personne_morale
  /v1/tiers/{identifiant_tiers}:
    parameters:
      - $ref: '#/components/parameters/IdentifiantTiers'
    get:
      operationId: consulter_tiers
      summary: Consulter un Tiers
      description: Retourne la représentation autorisée du Tiers sans données internes inutiles.
      tags:
        - Tiers
      security:
        - oauth2:
            - tiers:lecture
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '200':
          description: Tiers trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tiers'
        '400':
          $ref: '#/components/responses/RequeteInvalide'
        '401':
          $ref: '#/components/responses/AuthentificationRequise'
        '403':
          $ref: '#/components/responses/DroitInsuffisant'
        '404':
          $ref: '#/components/responses/RessourceAbsente'
        '409':
          $ref: '#/components/responses/ConflitMetier'
        '500':
          $ref: '#/components/responses/ErreurInterne'
      x-hydrosea-bs:
        - A_ARBITRER_BS_TIERS
      x-hydrosea-rm:
        - RM-TIE
      x-hydrosea-evt:
        - EVT-TIE-002
      x-hydrosea-tables:
        - ref.tiers
    patch:
      operationId: modifier_tiers
      summary: Modifier un Tiers
      description: Modifie les attributs autorisés selon la version attendue ; schéma PATCH spécifique à finaliser avec l’application.
      tags:
        - Tiers
      security:
        - oauth2:
            - tiers:ecriture
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModifierTiers'
      responses:
        '200':
          description: Tiers modifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tiers'
        '400':
          $ref: '#/components/responses/RequeteInvalide'
        '401':
          $ref: '#/components/responses/AuthentificationRequise'
        '403':
          $ref: '#/components/responses/DroitInsuffisant'
        '404':
          $ref: '#/components/responses/RessourceAbsente'
        '409':
          $ref: '#/components/responses/ConflitMetier'
        '412':
          $ref: '#/components/responses/PreconditionVersion'
        '500':
          $ref: '#/components/responses/ErreurInterne'
      x-hydrosea-bs:
        - A_ARBITRER_BS_TIERS
      x-hydrosea-rm:
        - RM-TIE
      x-hydrosea-evt:
        - EVT-TIE-002
      x-hydrosea-tables:
        - ref.tiers
        - ref.tiers_personne_physique
        - ref.tiers_personne_morale
  /v1/tiers/{identifiant_tiers}/fusionner:
    parameters:
      - $ref: '#/components/parameters/IdentifiantTiers'
    post:
      operationId: fusionner_tiers
      summary: Fusionner deux Tiers
      description: Conserve le Tiers cible et archive le doublon selon RM-TIE ; la sélection automatique du survivant n’est pas définie.
      tags:
        - Tiers
      security:
        - oauth2:
            - tiers:ecriture
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - identifiant_tiers_conserve
                - motif
              properties:
                identifiant_tiers_conserve:
                  type: string
                  format: uuid
                motif:
                  type: string
      responses:
        '200':
          description: Tiers conservé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tiers'
        '400':
          $ref: '#/components/responses/RequeteInvalide'
        '401':
          $ref: '#/components/responses/AuthentificationRequise'
        '403':
          $ref: '#/components/responses/DroitInsuffisant'
        '404':
          $ref: '#/components/responses/RessourceAbsente'
        '409':
          $ref: '#/components/responses/ConflitMetier'
        '412':
          $ref: '#/components/responses/PreconditionVersion'
        '500':
          $ref: '#/components/responses/ErreurInterne'
      x-hydrosea-bs:
        - A_ARBITRER_BS_TIERS
      x-hydrosea-rm:
        - RM-TIE-004
      x-hydrosea-evt:
        - EVT-TIE-003
      x-hydrosea-tables:
        - ref.tiers
  /v1/tiers/{identifiant_tiers}/archiver:
    parameters:
      - $ref: '#/components/parameters/IdentifiantTiers'
    post:
      operationId: archiver_tiers
      summary: Archiver un Tiers
      description: Archive le Tiers lorsque les dépendances métier l’autorisent.
      tags:
        - Tiers
      security:
        - oauth2:
            - tiers:ecriture
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - motif
              properties:
                motif:
                  type: string
      responses:
        '200':
          description: Tiers archivé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tiers'
        '400':
          $ref: '#/components/responses/RequeteInvalide'
        '401':
          $ref: '#/components/responses/AuthentificationRequise'
        '403':
          $ref: '#/components/responses/DroitInsuffisant'
        '404':
          $ref: '#/components/responses/RessourceAbsente'
        '409':
          $ref: '#/components/responses/ConflitMetier'
        '412':
          $ref: '#/components/responses/PreconditionVersion'
        '500':
          $ref: '#/components/responses/ErreurInterne'
      x-hydrosea-bs:
        - A_ARBITRER_BS_TIERS
      x-hydrosea-rm:
        - RM-TIE
      x-hydrosea-evt:
        - EVT-TIE-004
      x-hydrosea-tables:
        - ref.tiers
  /v1/tiers/{identifiant_tiers}/reactiver:
    parameters:
      - $ref: '#/components/parameters/IdentifiantTiers'
    post:
      operationId: reactiver_tiers
      summary: Réactiver un Tiers
      description: Réactive un Tiers archivé lorsque la règle métier l’autorise.
      tags:
        - Tiers
      security:
        - oauth2:
            - tiers:ecriture
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '200':
          description: Tiers réactivé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tiers'
        '400':
          $ref: '#/components/responses/RequeteInvalide'
        '401':
          $ref: '#/components/responses/AuthentificationRequise'
        '403':
          $ref: '#/components/responses/DroitInsuffisant'
        '404':
          $ref: '#/components/responses/RessourceAbsente'
        '409':
          $ref: '#/components/responses/ConflitMetier'
        '412':
          $ref: '#/components/responses/PreconditionVersion'
        '500':
          $ref: '#/components/responses/ErreurInterne'
      x-hydrosea-bs:
        - A_ARBITRER_BS_TIERS
      x-hydrosea-rm:
        - RM-TIE
      x-hydrosea-evt:
        - EVT-TIE-005
      x-hydrosea-tables:
        - ref.tiers
  /v1/contrats-abonnement:
    get:
      operationId: rechercher_contrats_abonnement
      summary: Rechercher des contrats d’abonnement
      description: Recherche paginée par référence, statut, Tiers ou Point de consommation.
      tags:
        - Contrats
      security:
        - oauth2:
            - contrats:lecture
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: taille_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: statut
          in: query
          schema:
            type: string
        - name: reference
          in: query
          schema:
            type: string
        - name: identifiant_tiers
          in: query
          schema:
            type: string
            format: uuid
        - name: identifiant_point_consommation
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Page de contrats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageContratsAbonnement'
        '400':
          $ref: '#/components/responses/RequeteInvalide'
        '401':
          $ref: '#/components/responses/AuthentificationRequise'
        '403':
          $ref: '#/components/responses/DroitInsuffisant'
        '409':
          $ref: '#/components/responses/ConflitMetier'
        '500':
          $ref: '#/components/responses/ErreurInterne'
      x-hydrosea-bs:
        - BS-CTR-001
      x-hydrosea-rm:
        - RM-CTR
      x-hydrosea-evt:
        - EVT-CTR-001
      x-hydrosea-tables:
        - abo.contrat_abonnement
        - abo.participation_contrat
    post:
      operationId: creer_contrat_abonnement
      summary: Créer un contrat d’abonnement
      description: Crée un brouillon relié à un Point de consommation et à ses participants initiaux.
      tags:
        - Contrats
      security:
        - oauth2:
            - contrats:ecriture
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreerContratAbonnement'
            examples:
              ouverture:
                $ref: '#/components/examples/ouverture'
      responses:
        '201':
          description: Brouillon créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContratAbonnement'
        '400':
          $ref: '#/components/responses/RequeteInvalide'
        '401':
          $ref: '#/components/responses/AuthentificationRequise'
        '403':
          $ref: '#/components/responses/DroitInsuffisant'
        '409':
          $ref: '#/components/responses/ConflitMetier'
        '500':
          $ref: '#/components/responses/ErreurInterne'
      x-hydrosea-bs:
        - BS-CTR-001
      x-hydrosea-rm:
        - RM-CTR-001
      x-hydrosea-evt:
        - EVT-CTR-001
      x-hydrosea-tables:
        - abo.contrat_abonnement
        - abo.liaison_contrat_consommation
        - abo.participation_contrat
  /v1/contrats-abonnement/{identifiant_contrat}:
    parameters:
      - $ref: '#/components/parameters/IdentifiantContrat'
    get:
      operationId: consulter_contrat_abonnement
      summary: Consulter un contrat d’abonnement
      description: Retourne le contrat, son Point de consommation et ses participants autorisés.
      tags:
        - Contrats
      security:
        - oauth2:
            - contrats:lecture
      responses:
        '200':
          description: Contrat trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContratAbonnement'
        '400':
          $ref: '#/components/responses/RequeteInvalide'
        '401':
          $ref: '#/components/responses/AuthentificationRequise'
        '403':
          $ref: '#/components/responses/DroitInsuffisant'
        '404':
          $ref: '#/components/responses/RessourceAbsente'
        '409':
          $ref: '#/components/responses/ConflitMetier'
        '500':
          $ref: '#/components/responses/ErreurInterne'
      x-hydrosea-bs:
        - BS-CTR-001
      x-hydrosea-rm:
        - RM-CTR
      x-hydrosea-evt:
        - EVT-CTR-002
      x-hydrosea-tables:
        - abo.contrat_abonnement
        - abo.participation_contrat
    patch:
      operationId: modifier_contrat_abonnement
      summary: Modifier un contrat d’abonnement
      description: Modifie les données autorisées avant ou pendant le cycle du contrat, sans commander une transition.
      tags:
        - Contrats
      security:
        - oauth2:
            - contrats:ecriture
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModifierContratAbonnement'
      responses:
        '200':
          description: Contrat modifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContratAbonnement'
        '400':
          $ref: '#/components/responses/RequeteInvalide'
        '401':
          $ref: '#/components/responses/AuthentificationRequise'
        '403':
          $ref: '#/components/responses/DroitInsuffisant'
        '404':
          $ref: '#/components/responses/RessourceAbsente'
        '409':
          $ref: '#/components/responses/ConflitMetier'
        '412':
          $ref: '#/components/responses/PreconditionVersion'
        '500':
          $ref: '#/components/responses/ErreurInterne'
      x-hydrosea-bs:
        - BS-CTR-002
      x-hydrosea-rm:
        - RM-CTR
      x-hydrosea-evt:
        - EVT-CTR-010
      x-hydrosea-tables:
        - abo.contrat_abonnement
  /v1/contrats-abonnement/{identifiant_contrat}/valider:
    parameters:
      - $ref: '#/components/parameters/IdentifiantContrat'
    post:
      operationId: valider_contrat_abonnement
      summary: Valider un contrat d’abonnement
      description: Vérifie les préconditions métier avant activation ; les contrôles restent définis par RM-CTR.
      tags:
        - Contrats
      security:
        - oauth2:
            - contrats:ecriture
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '200':
          description: Contrat validé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContratAbonnement'
        '400':
          $ref: '#/components/responses/RequeteInvalide'
        '401':
          $ref: '#/components/responses/AuthentificationRequise'
        '403':
          $ref: '#/components/responses/DroitInsuffisant'
        '404':
          $ref: '#/components/responses/RessourceAbsente'
        '409':
          $ref: '#/components/responses/ConflitMetier'
        '412':
          $ref: '#/components/responses/PreconditionVersion'
        '500':
          $ref: '#/components/responses/ErreurInterne'
      x-hydrosea-bs:
        - BS-CTR-002
      x-hydrosea-rm:
        - RM-CTR-001
      x-hydrosea-evt:
        - EVT-CTR-002
      x-hydrosea-tables:
        - abo.contrat_abonnement
        - abo.participation_contrat
  /v1/contrats-abonnement/{identifiant_contrat}/activer:
    parameters:
      - $ref: '#/components/parameters/IdentifiantContrat'
    post:
      operationId: activer_contrat_abonnement
      summary: Activer un contrat d’abonnement
      description: Active un contrat validé à sa date d’effet avec un titulaire principal.
      tags:
        - Contrats
      security:
        - oauth2:
            - contrats:ecriture
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '200':
          description: Contrat actif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContratAbonnement'
        '400':
          $ref: '#/components/responses/RequeteInvalide'
        '401':
          $ref: '#/components/responses/AuthentificationRequise'
        '403':
          $ref: '#/components/responses/DroitInsuffisant'
        '404':
          $ref: '#/components/responses/RessourceAbsente'
        '409':
          $ref: '#/components/responses/ConflitMetier'
        '412':
          $ref: '#/components/responses/PreconditionVersion'
        '500':
          $ref: '#/components/responses/ErreurInterne'
      x-hydrosea-bs:
        - BS-CTR-002
      x-hydrosea-rm:
        - RM-CTR-001
      x-hydrosea-evt:
        - EVT-CTR-003
      x-hydrosea-tables:
        - abo.contrat_abonnement
        - abo.participation_contrat
  /v1/contrats-abonnement/{identifiant_contrat}/suspendre:
    parameters:
      - $ref: '#/components/parameters/IdentifiantContrat'
    post:
      operationId: suspendre_contrat_abonnement
      summary: Suspendre un contrat d’abonnement
      description: Suspend le contrat selon le motif et la date d’effet fournis.
      tags:
        - Contrats
      security:
        - oauth2:
            - contrats:ecriture
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - motif
              properties:
                motif:
                  type: string
                date_effet:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Contrat suspendu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContratAbonnement'
        '400':
          $ref: '#/components/responses/RequeteInvalide'
        '401':
          $ref: '#/components/responses/AuthentificationRequise'
        '403':
          $ref: '#/components/responses/DroitInsuffisant'
        '404':
          $ref: '#/components/responses/RessourceAbsente'
        '409':
          $ref: '#/components/responses/ConflitMetier'
        '412':
          $ref: '#/components/responses/PreconditionVersion'
        '500':
          $ref: '#/components/responses/ErreurInterne'
      x-hydrosea-bs:
        - BS-CTR-005
      x-hydrosea-rm:
        - RM-CTR
      x-hydrosea-evt:
        - EVT-CTR-004
      x-hydrosea-tables:
        - abo.contrat_abonnement
  /v1/contrats-abonnement/{identifiant_contrat}/reactiver:
    parameters:
      - $ref: '#/components/parameters/IdentifiantContrat'
    post:
      operationId: reactiver_contrat_abonnement
      summary: Réactiver un contrat d’abonnement
      description: Réactive un contrat suspendu lorsque la transition est autorisée.
      tags:
        - Contrats
      security:
        - oauth2:
            - contrats:ecriture
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '200':
          description: Contrat réactivé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContratAbonnement'
        '400':
          $ref: '#/components/responses/RequeteInvalide'
        '401':
          $ref: '#/components/responses/AuthentificationRequise'
        '403':
          $ref: '#/components/responses/DroitInsuffisant'
        '404':
