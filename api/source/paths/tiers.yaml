tiers:
  get:
    operationId: rechercher_tiers
    x-hydrosea-disponibilite:
      statut: disponible
      implementation: hydrosea-app
      version_minimale: mission-006
    summary: Rechercher des Tiers
    description: Recherche multicritère paginée et minimisée. Cette opération ne qualifie pas les doublons ; BS-TIE-007 reste intégré à la création et aux décisions métier.
    tags: [Tiers]
    security: [{oauth2: ['tiers:lecture']}]
    parameters:
      - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
      - {name: taille_page, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      - {name: tri, in: query, schema: {type: string, enum: [reference, date_creation, statut], default: reference}}
      - {name: direction, in: query, schema: {type: string, enum: [asc, desc], default: asc}}
      - {name: recherche, in: query, schema: {type: string}}
      - {name: reference, in: query, schema: {type: string}}
      - {name: categorie, in: query, schema: {type: string, enum: [PERSONNE_PHYSIQUE, PERSONNE_MORALE]}}
      - {name: statut, in: query, schema: {type: string}}
    responses:
      '200': {description: Page de Tiers, content: {application/json: {schema: {$ref: '../openapi.yaml#/components/schemas/PageTiers'}}}}
      <<: *erreur
    x-hydrosea-bs: [BS-TIE-003]
    x-hydrosea-rm: [RM-TIE-010]
    x-hydrosea-evt: [AUCUN_EVENEMENT_PRODUIT]
    x-hydrosea-tables: [ref.tiers, ref.tiers_personne_physique, ref.tiers_personne_morale]
  post:
    operationId: creer_tiers
    x-hydrosea-disponibilite:
      statut: disponible
      implementation: hydrosea-app
      version_minimale: mission-006
    summary: Créer un Tiers
    description: Crée atomiquement un Tiers personne physique ou morale et contrôle les doublons probables.
    tags: [Tiers]
    security: [{oauth2: ['tiers:ecriture']}]
    parameters:
      - {$ref: '../openapi.yaml#/components/parameters/IdempotencyKey'}
      - {$ref: '../openapi.yaml#/components/parameters/XCorrelationId'}
    requestBody: {required: true, content: {application/json: {schema: {$ref: '../openapi.yaml#/components/schemas/CreerTiers'}, examples: {personne_physique: {$ref: '../examples/tiers.yaml#/personne_physique'}, personne_morale: {$ref: '../examples/tiers.yaml#/personne_morale'}}}}}
    responses:
      '201': {description: Tiers créé, content: {application/json: {schema: {$ref: '../openapi.yaml#/components/schemas/Tiers'}}}}
      <<: *erreur
    x-hydrosea-bs: [BS-TIE-001]
    x-hydrosea-rm: [RM-TIE-001, RM-TIE-002, RM-TIE-003, RM-TIE-007, RM-TIE-010]
    x-hydrosea-evt: [EVT-TIE-001]
    x-hydrosea-tables: [ref.tiers, ref.tiers_personne_physique, ref.tiers_personne_morale]
tiers_identifiant:
  parameters:
    - {$ref: '../openapi.yaml#/components/parameters/IdentifiantTiers'}
  get:
    operationId: consulter_tiers
    x-hydrosea-disponibilite:
      statut: disponible
      implementation: hydrosea-app
      version_minimale: mission-006
    summary: Consulter un Tiers
    description: Retourne la représentation autorisée du Tiers sans données internes inutiles.
    tags: [Tiers]
    security: [{oauth2: ['tiers:lecture']}]
    parameters: *correlations
    responses:
      '200': {description: Tiers trouvé, content: {application/json: {schema: {$ref: '../openapi.yaml#/components/schemas/Tiers'}}}}
      <<: *erreur_cible
    x-hydrosea-bs: [BS-TIE-002]
    x-hydrosea-rm: [RM-TIE-010]
    x-hydrosea-evt: [AUCUN_EVENEMENT_PRODUIT]
    x-hydrosea-tables: [ref.tiers, ref.tiers_personne_physique, ref.tiers_personne_morale, ref.coordonnees]
  patch:
    operationId: modifier_tiers
    x-hydrosea-disponibilite:
      statut: disponible
      implementation: hydrosea-app
      version_minimale: mission-006
    summary: Modifier un Tiers
    description: Modifie une spécialisation complète selon la version attendue. Le contrat interdit catégorie, référence, statut et données techniques ; la compatibilité avec la catégorie existante est contrôlée par RM-TIE-003 et ne peut être exprimée par OpenAPI seul.
    tags: [Tiers]
    security: [{oauth2: ['tiers:ecriture']}]
    parameters:
      - {$ref: '../openapi.yaml#/components/parameters/IfMatch'}
      - {$ref: '../openapi.yaml#/components/parameters/XCorrelationId'}
    requestBody: {required: true, content: {application/json: {schema: {$ref: '../openapi.yaml#/components/schemas/ModifierTiers'}}}}
    responses:
      '200': {description: Tiers modifié, content: {application/json: {schema: {$ref: '../openapi.yaml#/components/schemas/Tiers'}}}}
      <<: *erreur_version
    x-hydrosea-bs: [BS-TIE-004]
    x-hydrosea-rm: [RM-TIE-001, RM-TIE-003, RM-TIE-004, RM-TIE-007, RM-TIE-008, RM-TIE-009, RM-TIE-010]
    x-hydrosea-evt: [EVT-TIE-002]
    x-hydrosea-tables: [ref.tiers, ref.tiers_personne_physique, ref.tiers_personne_morale]
