x-commande: &commande [{$ref: '../openapi.yaml#/components/parameters/IdempotencyKey'}, {$ref: '../openapi.yaml#/components/parameters/IfMatch'}, {$ref: '../openapi.yaml#/components/parameters/XCorrelationId'}]
points_desserte:
  get:
    operationId: rechercher_points_desserte
    summary: Rechercher des Points de desserte
    description: Recherche le patrimoine synchronisé ; le SIG reste maître.
    tags: [Points]
    security: [{oauth2: ['comptage:lecture']}]
    parameters: [{name: page, in: query, schema: {type: integer, minimum: 1}}, {name: taille_page, in: query, schema: {type: integer, maximum: 100}}, {name: reference, in: query, schema: {type: string}}, {name: statut, in: query, schema: {type: string}}]
    responses: {'200': {description: Page de Points de desserte, content: {application/json: {schema: {$ref: '../openapi.yaml#/components/schemas/PagePointsDesserte'}}}}, <<: *erreur}
    x-hydrosea-bs: [BS-TRV-001]
    x-hydrosea-rm: [RM-PD]
    x-hydrosea-evt: [EVT-PD-001]
    x-hydrosea-tables: [des.point_desserte]
point_desserte:
  parameters: [{$ref: '../openapi.yaml#/components/parameters/IdentifiantPointDesserte'}]
  get:
    operationId: consulter_point_desserte
    summary: Consulter un Point de desserte
    description: Retourne les attributs synchronisés sans opération patrimoniale d’écriture.
    tags: [Points]
    security: [{oauth2: ['comptage:lecture']}]
    responses: {'200': {description: Point trouvé, content: {application/json: {schema: {$ref: '../openapi.yaml#/components/schemas/PointDesserte'}}}}, <<: *erreur_cible}
    x-hydrosea-bs: [BS-TRV-001]
    x-hydrosea-rm: [RM-PD]
    x-hydrosea-evt: [EVT-PD-006]
    x-hydrosea-tables: [des.point_desserte]
synchroniser_sig:
  post:
    operationId: synchroniser_points_desserte_sig
    summary: Synchroniser les Points de desserte depuis le SIG
    description: Importe les changements du référentiel maître sans modifier le SIG.
    tags: [Points]
    security: [{oauth2: [administration]}]
    parameters: [{$ref: '../openapi.yaml#/components/parameters/IdempotencyKey'}, {$ref: '../openapi.yaml#/components/parameters/XCorrelationId'}]
    responses: {'202': {description: Synchronisation acceptée}, <<: *erreur}
    x-hydrosea-bs: [BS-TRV-004]
    x-hydrosea-rm: [RM-PD]
    x-hydrosea-evt: [EVT-PD-006]
    x-hydrosea-tables: [des.point_desserte]
points_consommation:
  get:
    operationId: rechercher_points_consommation
    summary: Rechercher des Points de consommation
    description: Recherche paginée par référence, statut et usage.
