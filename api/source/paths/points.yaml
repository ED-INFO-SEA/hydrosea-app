    requestBody: {required: true, content: {application/json: {schema: {$ref: '../openapi.yaml#/components/schemas/ModifierPointConsommation'}}}}
    responses: {'200': {description: Point modifié, content: {application/json: {schema: {$ref: '../openapi.yaml#/components/schemas/PointConsommation'}}}}, <<: *erreur_version}
